<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="Классическая игра «Сапёр» с настройкой поля, таймером и таблицей лучших результатов."
    />
    <meta name="application-name" content="Сапёр" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Сапёр" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0b0e14" />
    <title>Сапёр</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="apple-touch-icon.png" />
    <link rel="mask-icon" href="icon.svg" color="#5b8cff" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <button
          class="btn btn--icon btn--share"
          id="share-btn"
          type="button"
          aria-label="Поделиться"
          title="Поделиться"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>
        <div class="app__logo" role="img" aria-label="Сапёр — логотип мина">
          <svg
            class="app__logo-icon"
            viewBox="0 0 64 64"
            width="56"
            height="56"
            aria-hidden="true"
          >
            <circle
              cx="32"
              cy="38"
              r="22"
              fill="#0f1218"
              stroke="url(#mineGrad)"
              stroke-width="3"
            />
            <path
              d="M32 16 v-9"
              stroke="#e6ebf4"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path
              d="M30 10 q7 -6 13 -3"
              stroke="#ff9f43"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"
            />
            <circle cx="30" cy="9" r="3.5" fill="#ffd27a" />
            <circle cx="26" cy="30" r="3" fill="#e6ebf4" />
            <circle cx="38" cy="28" r="3" fill="#e6ebf4" />
            <rect x="29" y="44" width="6" height="4" rx="1" fill="#8b97ab" />
            <defs>
              <linearGradient id="mineGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5b8cff" />
                <stop offset="1" stop-color="#7ba3ff" />
              </linearGradient>
            </defs>
          </svg>
          <span class="app__title">Сапёр</span>
        </div>
      </header>

      <main class="app__main">
        <section class="panel panel--settings" aria-label="Настройка поля">
          <form id="settings-form" class="settings" novalidate>
            <div class="field">
              <div class="field__row">
                <label class="field__label" for="width">Ширина</label>
                <output class="field__value" id="width-value" for="width"
                  >9</output
                >
              </div>
              <input
                class="field__range"
                id="width"
                type="range"
                min="5"
                max="20"
                value="9"
              />
            </div>
            <div class="field">
              <div class="field__row">
                <label class="field__label" for="height">Высота</label>
                <output class="field__value" id="height-value" for="height"
                  >9</output
                >
              </div>
              <input
                class="field__range"
                id="height"
                type="range"
                min="5"
                max="20"
                value="9"
              />
            </div>
            <div class="field field--wide">
              <div class="field__row">
                <label class="field__label" for="mines">Мин</label>
                <output class="field__value" id="mines-value" for="mines"
                  >15%</output
                >
              </div>
              <input
                class="field__range"
                id="mines"
                type="range"
                min="5"
                max="40"
                value="15"
              />
            </div>
            <button class="btn btn--primary btn--wide" type="submit">
              Новая игра
            </button>
          </form>
        </section>

        <section class="panel panel--game" aria-label="Игровое поле">
          <div class="statusbar">
            <div
              class="statusbar__item"
              id="mine-counter"
              title="Оставшиеся мины"
            >
              10
            </div>
            <button
              class="face-btn"
              id="reset-btn"
              type="button"
              aria-label="Новая игра"
            >
              🙂
            </button>
            <div
              class="statusbar__item statusbar__item--time"
              id="timer"
              title="Время"
            >
              00:00
            </div>
          </div>
          <div class="board-wrap" id="board-wrap"></div>
          <button
            class="btn btn--primary btn--restart hidden"
            id="restart-settings-btn"
            type="button"
          >
            Новая игра
          </button>
        </section>

        <section
          class="panel panel--leaderboard"
          aria-label="Таблица лучших результатов"
        >
          <div class="panel__head">
            <h2 class="panel__title">Лучшие результаты</h2>
            <button
              class="btn btn--ghost"
              id="reset-leaderboard-btn"
              type="button"
            >
              Сбросить
            </button>
          </div>
          <div id="leaderboard"></div>
        </section>
      </main>

      <footer class="app__footer">
        <a
          class="app__footer-link"
          href="https://github.com/Dmitry-prg"
          target="_blank"
          rel="noopener noreferrer"
        >
          Dmitry Davydov
        </a>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/minesweeper.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Ошибка регистрации service worker:", error);
          });
        });
      }
    </script>
  </body>
</html>
